# Gumbel Distributed Training Experiment Configuration
experiment_name: "baseline_1000_attrs"
description: "Baseline experiment with 100 attributes"

# Model configuration
model:
  d: 1000
  k: 10
  lr: 1e-3
  sparsity_weight: 1e-4
  tau_init: 1.0

# Data configuration
data:
  dataset_path: "gumbel/data/persona_train_dataset.pkl"
  attribute_prompts_path: "gumbel/configs/attribute_prompts.json"

# VLLM server configuration
vllm:
  model_name: "meta-llama/Llama-3.2-1B-Instruct"
  server_url: "http://localhost:8000"
  gpu_memory_util: 0.6
  start_server: true       # Whether to auto-start VLLM server

# Server configurations
servers:
  collector:
    host: "0.0.0.0"
    port: 8001
    device: "cuda:0"       # GPU for collector
    concurrency: 256       # Request concurrency
    
  learner:
    host: "0.0.0.0"
    port: 8002
    device: "cuda:0"       # GPU for learner (can be same as collector)
    checkpoint_dir: "./checkpoints"
    checkpoint_every: 500  # Save checkpoint every N steps (0 disables)
    use_wandb: false

# Training configuration
training:
  max_steps: 1000
  log_freq: 20
  checkpoint_freq: 100
  users_per_batch: 4
  samples_per_user: 8
  queue_size: 100
  replay_buffer_size: 10000
  replay_ratio: 0.3
  buffer_save_path: "replay_buffer.pkl"
  offline_mode: false
  offline_threshold: 10000

# Monitoring configuration
monitoring:
  enable_monitoring: true
  enable_wandb: false
  plot_update_interval: 10.0
  log_level: "INFO"

# Timeout configurations (in seconds)
timeouts:
  server_health_check: 120.0
  server_startup_wait: 300.0
  get_params: 120.0
  generate_batch: 180.0
  train_step: 120.0
  server_status: 120.0
  system_check: 150.0

# Optional: Override environment variables
environment:
  # Collector server settings
  COLLECTOR_CONCURRENCY: 256
  REQUEST_BATCH_SIZE: 512
  REQUEST_RETRIES: 5
  REQUEST_TIMEOUT: 180
  PER_HOST_LIMIT: 128
  TOTAL_CONN_LIMIT: 256
  
  # VLLM connection settings
  VLLM_URL: "http://localhost:8000/v1/completions"
  MODEL_ID: "meta-llama/Llama-3.2-1B-Instruct"
  VLLM_CONCURRENCY: 256
  VLLM_MAX_RETRIES: 7
  
  # Monitoring
  WANDB_PROJECT: "gumbel-distributed"