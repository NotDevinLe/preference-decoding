# Example configuration for using the rewards dataset
# This shows how to configure the IP-CAE model to work with your reward data

# Dataset configuration
dataset: "rewards"  # Use the new rewards dataset
data_root_dir: "/gscratch/ark/devinl6/preference/preference-decoding/data"

# Model configuration
model: "ConcreteLinearRandom"  # or other CAE model
dim_ip: 400  # Number of attributes in your reward data (adjust based on your data)
k: 20  # Number of features to select (adjust as needed)
# mask_ratio: 0.5  # Either specify mask_ratio OR k, not both

# Training configuration
batch_size: 1024
epochs: 50
lr: 0.001
blr: 0.001  # base learning rate

# Loss configuration
loss_type: "mse"  # Mean squared error for reconstruction
jsd_factor: 0  # Jensen-Shannon divergence factor
eeg_factor: 0.0  # EEG factor (set to 0 if not using)

# Temperature and threshold annealing
anneal_temp: "exp"  # or "linear", "exponential"
temp_base: 10.0
temp_min: 0.01

# Training settings
straight_through: 1
rao_samples: 1
use_masked_loss: 0
norm_pix_loss: 0

# Output configuration
output_dir: "./outs/rewards_experiment"
log_dir: "./logs/rewards_experiment"
save_top_k: 3
save_last: 1
every_n_epochs: 10

# Logging
wandb: "rewards-cae-experiment"

gumbel_learn_mode: "logits"

# Other settings
seed: 42
scale_lr_by_batchsize: 0