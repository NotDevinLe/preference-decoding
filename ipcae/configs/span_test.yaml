# Example configuration for using the rewards dataset
# This shows how to configure the IP-CAE model to work with your reward data

# Dataset configuration
dataset: "custom"  # Use the new rewards dataset
data_path: "/gscratch/ark/devinl6/preference/preference-decoding/ipcae/span_test/20_ind_20_dep.npy"

# Model configuration
model: "ConcreteLinear"  # or other CAE model
input_dim: 40
dim_ip: 1000
k: 20  # Number of features to select (adjust as needed)
# mask_ratio: 0.5  # Either specify mask_ratio OR k, not both

# Training configuration
batch_size: 4096
epochs: 500
lr: 0.001
blr: 0.001  # base learning rate

# Loss configuration
loss_type: "mse"  # Mean squared error for reconstruction
jsd_factor: 0  # Jensen-Shannon divergence factor
eeg_factor: 0.0  # EEG factor (set to 0 if not using)

# Temperature and threshold annealing
anneal_temp: "exp"  # or "linear", "exponential"
temp_base: 10.0
temp_min: 0.01

# Training settings
straight_through: 1
rao_samples: 1
use_masked_loss: 0
norm_pix_loss: 0

# Output configuration
output_dir: "./outs/span_test"
log_dir: "./logs/span_test"
save_top_k: 3
save_last: 1
every_n_epochs: 10

# Logging
wandb: "span-cae-experiment"

gumbel_learn_mode: "logits"

# Other settings
seed: 42
scale_lr_by_batchsize: 0